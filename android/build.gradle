plugins {
    id 'com.android.library'
    id 'com.google.devtools.ksp' version '2.3.12'
}

group = 'com.keevault.flutter_autofill_service'
version = '1.0-SNAPSHOT'

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    namespace "com.keevault.flutter_autofill_service"

    compileSdk 37

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        minSdkVersion 29
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation "androidx.annotation:annotation:1.11.0"
    implementation 'androidx.autofill:autofill:1.3.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'io.github.oshai:kotlin-logging-jvm:8.0.4'
    implementation 'org.tinylog:tinylog-api:2.8.1'
    implementation 'org.tinylog:tinylog-impl:2.8.1'
    implementation 'org.tinylog:slf4j-tinylog:2.8.1'
    implementation "androidx.credentials:credentials:1.6.0"

    // json deserialize
    implementation "com.squareup.moshi:moshi:1.15.2"
    implementation "com.squareup.moshi:moshi-kotlin:1.15.2"
    ksp "com.squareup.moshi:moshi-kotlin-codegen:1.15.2"
}
