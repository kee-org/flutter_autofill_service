name: flutter_autofill_service
description: Integrate Flutter with platform autofill services. Inspired by similar autofill_service package.
version: 0.24.0
issue_tracker: https://github.com/kee-org/flutter_autofill_service/issues/
homepage: https://github.com/kee-org/flutter_autofill_service/
repository: https://github.com/kee-org/flutter_autofill_service/

environment:
  sdk: '>=2.19.0 <4.0.0'
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.2.0
  universal_platform: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0

flutter:
  plugin:
    platforms:
      android:
        package: com.keevault.flutter_autofill_service
        pluginClass: FlutterAutofillPlugin
